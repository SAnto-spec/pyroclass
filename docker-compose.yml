services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: pyroclass-postgres
    environment:
      POSTGRES_DB: pyroclass
      POSTGRES_USER: pyroclass
      POSTGRES_PASSWORD: pyroclass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pyroclass-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: